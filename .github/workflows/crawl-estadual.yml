name: Crawl state laws

on:
  schedule:
    - cron: "30 7 * * *" # 04:30 in Brasília, every night, after the federal crawl
  workflow_dispatch:
    inputs:
      states:
        description: "UFs to crawl, comma-separated (empty = every house with a crawler)"
        required: false
      since:
        description: "First year (1989 for a full backfill; empty = last year, or 1989 for a house with no data yet)"
        required: false
  pull_request:
    paths:
      - "crawlers/estadual/**"
      - "crawlers/lib/**"
      - ".github/workflows/crawl-estadual.yml"

jobs:
  # On pull requests: a small live run against the real assembly APIs, without writing anything.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # TSE candidate files for past elections never change; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/tse
          key: tse-consulta-cand-v1
      # One SAPL house per call so a failing house is easy to spot; 3 laws per type and year.
      - run: npm run crawl:estadual -- --dry-run --allow-unavailable --states PB --since 2025 --until 2025 --limit 3
      - run: npm run crawl:estadual -- --dry-run --allow-unavailable --states RO --since 2025 --until 2025 --limit 3
      - run: npm run crawl:estadual -- --dry-run --allow-unavailable --states AM --since 2025 --until 2025 --limit 3
      - run: npm run crawl:estadual -- --dry-run --allow-unavailable --states AC,AL,PI,TO --since 2025 --until 2025 --limit 2
      # Acre returned nothing for 2025; look further back.
      - run: npm run crawl:estadual -- --dry-run --allow-unavailable --states AC --since 2018 --until 2024 --limit 1
      # Alesp: downloads the full dump, keeps 2025, and matches deputies to TSE election data for their party.
      - run: npm run crawl:estadual -- --dry-run --allow-unavailable --states SP --since 2025 --until 2025

  crawl:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Commits the laws and the crawl status to the data branch.
    permissions:
      contents: write
    # A first run backfills every SAPL house from 1989 (one request per law, throttled per host).
    timeout-minutes: 340
    # Every crawler shares this group, so only one of them writes to the data branch at a time.
    concurrency:
      group: data-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The laws and the crawl status live on the data branch; this copies them into data/.
      - name: Check out the data branch
        run: scripts/data-branch.sh checkout
      # TSE candidate files for past elections never change; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/tse
          key: tse-consulta-cand-v1
      # Tells the site this crawler is collecting now (status/runs.json on the data branch). Never fails the job.
      - name: Mark as collecting
        run: |
          node --experimental-strip-types --no-warnings scripts/crawl-run.ts start crawlers/estadual/run.ts
          scripts/data-branch.sh push "estadual: collecting" || echo "::warning::status not pushed"
      - name: Crawl
        id: crawl
        env:
          STATES: ${{ inputs.states }}
          SINCE: ${{ inputs.since }}
        run: |
          args=()
          [ -n "$STATES" ] && args+=(--states "$STATES")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          npm run crawl:estadual -- "${args[@]}"
      # Runs after failures and cancellations too: commits what the crawl saved (each save writes whole files,
      # so a partial run is consistent) and stops the site showing "coletando agora".
      - name: Save the laws and the outcome
        if: always()
        run: |
          node --experimental-strip-types --no-warnings scripts/crawl-run.ts finish crawlers/estadual/run.ts "${{ steps.crawl.outcome }}"
          scripts/data-branch.sh push "estadual: ${{ steps.crawl.outcome }} (run ${{ github.run_id }})"

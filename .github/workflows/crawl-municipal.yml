name: Crawl municipal laws (capitals)

on:
  schedule:
    - cron: "30 8 * * *" # 05:30 in Brasília, every night, after the state crawl
  workflow_dispatch:
    inputs:
      cities:
        description: "Capitals to crawl: IBGE codes, names or UFs, comma-separated (empty = every câmara with a crawler)"
        required: false
      since:
        description: "First year (1989 for a full backfill; empty = last year, or 1989 for a câmara with no data yet)"
        required: false
  pull_request:
    paths:
      - "crawlers/municipal/**"
      - "crawlers/estadual/sapl.ts"
      - "crawlers/estadual/http.ts"
      - "crawlers/estadual/zip.ts"
      - "crawlers/lib/**"
      - ".github/workflows/crawl-municipal.yml"

jobs:
  # On pull requests: a small live run against the real câmara APIs and TSE, without writing anything.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: .cache/tse
          key: tse-consulta-cand-municipal-v1
      # SAPL câmaras, 2 laws per type, with the 2024 mayors from TSE.
      - run: npm run crawl:municipal -- --dry-run --allow-unavailable --cities Fortaleza,Natal,"João Pessoa" --since 2025 --until 2025 --limit 2 --mayor-elections 2024
      - run: npm run crawl:municipal -- --dry-run --allow-unavailable --cities "Porto Velho","Rio Branco",Manaus,"Boa Vista",Palmas,Recife --since 2025 --until 2025 --limit 2 --mayor-elections none
      # São Paulo: the first 40 authors' laws.
      - run: npm run crawl:municipal -- --dry-run --allow-unavailable --cities "São Paulo" --since 1989 --limit 40 --mayor-elections none

  crawl:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Commits the laws and the crawl status to the data branch.
    permissions:
      contents: write
    # A first run backfills every SAPL câmara from 1989 (a few requests per law, throttled per host).
    timeout-minutes: 340
    # Every crawler shares this group, so only one of them writes to the data branch at a time.
    concurrency:
      group: data-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The laws and the crawl status live on the data branch; this copies them into data/.
      - name: Check out the data branch
        run: scripts/data-branch.sh checkout
      # TSE candidate files for past elections never change; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/tse
          key: tse-consulta-cand-municipal-v1
      # Tells the site this crawler is collecting now (status/runs.json on the data branch). Never fails the job.
      - name: Mark as collecting
        run: |
          node --experimental-strip-types --no-warnings scripts/crawl-run.ts start crawlers/municipal/run.ts
          scripts/data-branch.sh push "municipal: collecting" || echo "::warning::status not pushed"
      - name: Crawl
        id: crawl
        env:
          CITIES: ${{ inputs.cities }}
          SINCE: ${{ inputs.since }}
        run: |
          args=()
          [ -n "$CITIES" ] && args+=(--cities "$CITIES")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          npm run crawl:municipal -- "${args[@]}"
      # Runs after failures and cancellations too: commits what the crawl saved (each save writes whole files,
      # so a partial run is consistent) and stops the site showing "coletando agora".
      - name: Save the laws and the outcome
        if: always()
        run: |
          node --experimental-strip-types --no-warnings scripts/crawl-run.ts finish crawlers/municipal/run.ts "${{ steps.crawl.outcome }}"
          scripts/data-branch.sh push "municipal: ${{ steps.crawl.outcome }} (run ${{ github.run_id }})"

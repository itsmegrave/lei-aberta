name: Crawl Diários Oficiais

on:
  schedule:
    # 06:30 UTC (03:30 in Brasília), after the DOU's early-morning edition.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "qd, dou or all"
        default: all
      since:
        description: "First publication day, YYYY-MM-DD (empty = last few days)"
        required: false
      until:
        description: "Last publication day, YYYY-MM-DD (empty = today)"
        required: false
      territories:
        description: "Querido Diário cities: capitals, all, or IBGE codes separated by commas"
        default: capitals
  pull_request:
    paths:
      - "crawlers/diarios/**"
      - ".github/workflows/crawl-diarios.yml"

jobs:
  # On pull requests: read one recent week from the live sources without writing,
  # so a format change on in.gov.br or Querido Diário shows up before merge.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: diarios-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Reachability of the sources from the runner
        run: |
          probe() { echo "== $*"; curl -sS -m 20 -o /dev/null -w "HTTP %{http_code} %{http_version}, %{time_total}s, ip %{remote_ip}\n" "$@" || true; }
          probe --http1.1 "https://www.in.gov.br/leiturajornal"
          probe --http1.1 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36" "https://www.in.gov.br/leiturajornal"
          probe "https://api.queridodiario.ok.org.br/gazettes?size=1"
          probe "https://queridodiario.ok.org.br/api/gazettes?size=1"
      - name: Dry run against live sources
        env:
          QD_DEBUG: "1"
          DOU_DEBUG: "1"
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: |
          node --experimental-strip-types --no-warnings crawlers/diarios/run.ts --dry-run --source all \
            --since "$(date -u -d '8 days ago' +%F)" --until "$(date -u -d '1 day ago' +%F)" --max-gazettes 60

  crawl:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every data crawler shares this group so only one of them pushes to main at a time.
    concurrency:
      group: data-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # The store mirrors every save into Postgres, which needs drizzle-orm and postgres.
      - run: npm ci
      # Tells the site this crawler is collecting now (crawl_runs in Postgres). Never fails the job.
      - name: Mark as collecting
        env:
          CRAWL_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --experimental-strip-types --no-warnings scripts/crawl-run.ts start crawlers/diarios/run.ts
      - name: Crawl
        id: crawl
        env:
          CRAWL_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE: ${{ inputs.source || 'all' }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          TERRITORIES: ${{ inputs.territories || 'capitals' }}
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: |
          args=(--source "$SOURCE" --territories "$TERRITORIES")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
          node --experimental-strip-types --no-warnings crawlers/diarios/run.ts "${args[@]}"
      # Runs after failures and cancellations too, so the site stops showing "coletando agora".
      - name: Record the outcome
        if: always()
        env:
          CRAWL_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --experimental-strip-types --no-warnings scripts/crawl-run.ts finish crawlers/diarios/run.ts "${{ steps.crawl.outcome }}"

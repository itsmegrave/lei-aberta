name: Crawl Diários Oficiais

on:
  schedule:
    # 06:30 UTC (03:30 in Brasília), after the DOU's early-morning edition.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "dou, qd or all"
        default: all
      since:
        description: "First publication day, YYYY-MM-DD (empty = last few days)"
        required: false
      until:
        description: "Last publication day, YYYY-MM-DD (empty = today)"
        required: false
      territories:
        description: "Querido Diário cities: capitals, all, or IBGE codes separated by commas"
        default: capitals
  pull_request:
    paths:
      - "crawlers/diarios/**"
      - ".github/workflows/crawl-diarios.yml"

jobs:
  # On pull requests: read one recent week from the live sources without writing,
  # so a format change on in.gov.br or Querido Diário shows up before merge.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: diarios-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Reachability of the sources from the runner
        run: |
          for u in "https://www.in.gov.br/leiturajornal" "https://api.queridodiario.ok.org.br/cities?city_name=Recife" "https://queridodiario.ok.org.br/"; do
            echo "== $u"; curl -sS -m 20 -o /dev/null -w "HTTP %{http_code}, %{time_total}s, ip %{remote_ip}\n" "$u" || true
          done
      - name: Dry run against live sources
        run: |
          node --experimental-strip-types --no-warnings crawlers/diarios/run.ts --dry-run \
            --since "$(date -u -d '8 days ago' +%F)" --until "$(date -u -d '1 day ago' +%F)" --max-gazettes 60

  crawl:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every data crawler shares this group so only one of them pushes to main at a time.
    concurrency:
      group: data-commit
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Crawl
        env:
          SOURCE: ${{ inputs.source || 'all' }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          TERRITORIES: ${{ inputs.territories || 'capitals' }}
        run: |
          args=(--source "$SOURCE" --territories "$TERRITORIES")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
          node --experimental-strip-types --no-warnings crawlers/diarios/run.ts "${args[@]}"
      # Also runs after a failed crawl, so the "failing" status in data/sources/ reaches the site.
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "lei-aberta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "data: Diários Oficiais $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Export open data

# Publishes every law in Postgres as JSON and CSV on the "dados" release, once a day after the
# nightly crawls, so the catalog stays open without committing it to the repo.
#   https://github.com/itsmegrave/lei-aberta/releases/tag/dados
on:
  schedule:
    - cron: "30 13 * * *" # 10:30 in Brasília, after the federal, state and Diários crawls
  workflow_dispatch:

concurrency:
  group: export-data
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:export -- dist/dados
      - name: Publish on the "dados" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Todas as leis do Lei Aberta, exportadas do banco em $(date -u +%F).
          leis.json.gz: os registros completos (mesmo formato do site).
          leis.csv.gz: uma linha por lei; listas separadas por \" | \". O partido do Executivo fica em coluna própria, separado dos partidos dos autores.
          Para usar localmente: npm run data:pull"
          if gh release view dados >/dev/null 2>&1; then
            gh release edit dados --notes "$notes"
          else
            gh release create dados --title "Dados abertos" --notes "$notes" --latest=false
          fi
          gh release upload dados dist/dados/leis.json.gz dist/dados/leis.csv.gz --clobber

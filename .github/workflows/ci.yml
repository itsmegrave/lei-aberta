name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Live check of the home's news feeds. Outside sites can break any day, so this never blocks a PR.
      - name: News feeds
        continue-on-error: true
        run: npm run check:news
      # The data-branch script, end to end against a throwaway remote: seed, commit, push, read back.
      - name: Data branch round trip
        run: sh test/data-branch.sh
      # Builds on the 75-law sample in lib/fixtures/catalog; Vercel builds on the full catalog (npm run data:pull).
      - name: Build
        run: npm run build

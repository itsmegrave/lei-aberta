name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lei_aberta
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Schema and JSON import against a throwaway Postgres, so a migration or import break shows up here.
      - name: Database migrate + import
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lei_aberta
        run: npm run db:migrate && npm run db:import-json
      # The site reads Postgres whenever DATABASE_URL is set, as on Vercel.
      - name: Build (reading Postgres)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lei_aberta
        run: npm run build

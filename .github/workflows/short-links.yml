name: Dub short links

# Creates Dub short links for laws that lack one and commits data/short-links.json.
# Needs the DUB_API_KEY repository secret; DUB_DOMAIN (custom short domain) and
# DUB_MAX_NEW_LINKS (default 20, Dub's free plan allows 25 new links a month) are optional repository variables.
on:
  schedule:
    - cron: "30 9 * * *" # 06:30 in Brasília, after the nightly crawls
  workflow_dispatch:
    inputs:
      max:
        description: "Most new links to create in this run"
        required: false
  push:
    branches: [main]
    paths:
      - "data/**"
      - "!data/short-links.json"
      - "scripts/short-links.ts"

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Shared with the crawlers so only one job commits to main at a time.
    concurrency:
      group: data-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Create missing short links
        env:
          DUB_API_KEY: ${{ secrets.DUB_API_KEY }}
          DUB_DOMAIN: ${{ vars.DUB_DOMAIN }}
          DUB_MAX_NEW_LINKS: ${{ inputs.max || vars.DUB_MAX_NEW_LINKS || '20' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://lei-aberta.vercel.app' }}
        run: node --experimental-strip-types --no-warnings scripts/short-links.ts
      - name: Commit short links
        run: |
          git config user.name "lei-aberta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/short-links.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: Dub short links $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

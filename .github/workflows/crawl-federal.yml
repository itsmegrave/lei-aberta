name: Crawl federal laws and MPs

on:
  schedule:
    - cron: "30 6 * * *" # 03:30 in Brasília, every night
  workflow_dispatch:
    inputs:
      from:
        description: "First year (empty = since the last good run)"
        required: false
      to:
        description: "Last year (empty = this year)"
        required: false
      full:
        description: "Re-resolve laws already in the data (after a crawler fix)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "crawlers/**"
      - ".github/workflows/crawl-federal.yml"

jobs:
  # On pull requests: a small live run against the real APIs, without writing anything.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Known cases: a Câmara bill (Estatuto do Idoso), a Senate bill (ECA), an executive bill (LDO 2021).
      - run: npm run crawl:federal -- --from 2003 --to 2003 --types LEI --only 10741 --dry-run
      - run: npm run crawl:federal -- --from 1990 --to 1990 --types LEI --only 8069 --dry-run
      - run: npm run crawl:federal -- --from 2020 --to 2020 --types LEI --only 14116 --dry-run
      # A pre-EC 32 reissued MP, and a sample of a recent year of every type.
      - run: npm run crawl:federal -- --from 1999 --to 1999 --types MPV --only 1858 --dry-run
      - run: npm run crawl:federal -- --from 2025 --to 2025 --limit 5 --dry-run
      # The nightly path (incremental from the cursor in data/sources) on a copy. The laws live on the data
      # branch, not in this checkout, so cap it: it would otherwise re-crawl the cursor's year.
      - name: Incremental run on a copy of the data
        run: |
          cp -r data "$RUNNER_TEMP/data"
          npm run crawl:federal -- --data "$RUNNER_TEMP/data" --limit 5
      - name: Check the hand-written sample's links
        run: npm run check:links
        continue-on-error: true

  crawl:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Commits the laws and the crawl status to the data branch.
    permissions:
      contents: write
    timeout-minutes: 340
    # Every crawler shares this group, so only one of them writes to the data branch at a time.
    concurrency:
      group: data-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The laws and the crawl status live on the data branch; this copies them into data/.
      - name: Check out the data branch
        run: scripts/data-branch.sh checkout
      # Tells the site this crawler is collecting now (status/runs.json on the data branch). Never fails the job.
      - name: Mark as collecting
        run: |
          node --experimental-strip-types --no-warnings scripts/crawl-run.ts start crawlers/federal/run.ts
          scripts/data-branch.sh push "federal: collecting" || echo "::warning::status not pushed"
      - name: Crawl
        id: crawl
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          FULL: ${{ inputs.full }}
        run: |
          args=()
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ -n "$TO" ] && args+=(--to "$TO")
          [ "$FULL" = "true" ] && args+=(--full)
          npm run crawl:federal -- "${args[@]}"
      # Runs after failures and cancellations too: commits what the crawl saved (each save writes whole files,
      # so a partial run is consistent) and stops the site showing "coletando agora".
      - name: Save the laws and the outcome
        if: always()
        run: |
          node --experimental-strip-types --no-warnings scripts/crawl-run.ts finish crawlers/federal/run.ts "${{ steps.crawl.outcome }}"
          scripts/data-branch.sh push "federal: ${{ steps.crawl.outcome }} (run ${{ github.run_id }})"
